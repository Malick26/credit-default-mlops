name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/malick26/credit-default-mlops:${{ github.sha }}

jobs:
  build:
    name: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push the image tagged with the commit
        run: |
          docker build --build-arg GIT_SHA=${{ github.sha }} -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    name: deploy-production
    needs: build
    if: ${{ vars.APP_URL != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_URL: ${{ vars.APP_URL }}
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ vars.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Trigger the Render deploy of this exact image
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          IMG=$(python -c "import os, urllib.parse; print(urllib.parse.quote(os.environ['IMAGE'], safe=''))")
          curl -fsS -X POST "${HOOK}&imgURL=${IMG}"

      - name: Expected model version (current champion)
        id: champion
        run: |
          V=$(python -c "from mlflow import MlflowClient; print(MlflowClient().get_model_version_by_alias('credit-default', 'champion').version)")
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Wait until the new commit is live
        run: |
          for i in $(seq 1 60); do
            live=$(curl -fs "$APP_URL/model-info" | python -c "import sys, json; print(json.load(sys.stdin).get('app_commit'))" || true)
            [ "$live" = "${{ github.sha }}" ] && echo "Live: $live" && exit 0
            sleep 10
          done
          echo "Commit ${{ github.sha }} not live after 10 min (live: $live)"; exit 1

      - name: Smoke test the live URL (real prediction + model version)
        run: python -m tests.smoke.smoke_test "$APP_URL" --expect-version "${{ steps.champion.outputs.version }}" --timeout 300